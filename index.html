
                       <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket Career Simulator: Pro League</title>
    <style>
        :root {
            --primary: #1e3799;
            --secondary: #44bd32;
            --danger: #c23616;
            --warning: #fbc531;
            --bg: #f5f6fa;
            --text: #2f3640;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1, h2, h3 {
            color: var(--primary);
            text-align: center;
            margin-top: 0;
        }

        /* Screens */
        #setup-screen, #game-screen, #season-end-screen {
            width: 100%;
            max-width: 800px;
            display: none; /* Handled by JS */
            flex-direction: column;
            align-items: center;
        }

        #setup-screen { display: flex; } /* Default visible */

        /* Setup Form */
        .setup-card, .season-end-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }

        .form-group {
            margin-bottom: 15px;
            width: 100%;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        .form-group input[disabled] {
            background-color: #e84118;
            color: white;
            font-weight: bold;
            border: none;
        }

        /* Dashboard */
        .header-bar {
            background: var(--primary);
            color: white;
            width: 100%;
            padding: 15px 20px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            box-sizing: border-box;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .header-bar span { font-weight: bold; color: var(--warning); }

        .dashboard {
            display: flex;
            gap: 20px;
            width: 100%;
            margin-bottom: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            flex: 1;
            text-align: center;
        }

        .card h3 {
            font-size: 1.1rem;
            border-bottom: 2px solid var(--bg);
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .stat-value {
            color: var(--secondary);
            font-size: 1.3rem;
            display: block;
            margin-top: 5px;
        }

        /* Game Area */
        .game-area {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            text-align: center;
            box-sizing: border-box;
        }

        .message {
            font-size: 1.3rem;
            font-weight: bold;
            height: 35px;
            margin-bottom: 15px;
            color: var(--primary);
        }

        .tiles-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 20px auto;
            max-width: 400px;
        }

        .tile {
            background-color: var(--primary);
            color: white;
            height: 100px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.3s;
            user-select: none;
        }

        .tile:hover { transform: scale(1.05); background-color: #273c75; }
        .tile.revealed { cursor: default; transform: none; }
        .tile.runs { background-color: var(--secondary); }
        .tile.dot { background-color: #718093; }
        .tile.out { background-color: var(--danger); }
        .tile.disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
        }

        button:hover { background-color: #273c75; }
        button.action-btn { background-color: var(--warning); color: #333; }
        button.action-btn:hover { background-color: #e1b12c; }

    </style>
</head>
<body>

    <h1>🏏 Pro Cricket Career</h1>

    <!-- SCREEN 1: PLAYER SETUP -->
    <div id="setup-screen">
        <div class="setup-card">
            <h2>Create Your Player</h2>
            <div class="form-group">
                <label>Player Name:</label>
                <input type="text" id="p-name" placeholder="Enter your name" value="Rookie">
            </div>
            <div class="form-group">
                <label>Nationality:</label>
                <input type="text" id="p-nation" placeholder="e.g. India, Australia" value="India">
            </div>
            <div class="form-group">
                <label>Select Team:</label>
                <select id="p-team">
                    <option value="Strikers">Strikers</option>
                    <option value="Titans">Titans</option>
                    <option value="Warriors">Warriors</option>
                    <option value="Royals">Royals</option>
                    <option value="Knights">Knights</option>
                    <option value="Spartans">Spartans</option>
                    <option value="Legends">Legends</option>
                    <option value="Gladiators">Gladiators</option>
                    <option value="Invincibles">Invincibles</option>
                    <option value="Challengers">Challengers</option>
                </select>
            </div>
            <div class="form-group">
                <label>Starting Division:</label>
                <input type="text" value="Division 3 (Amateur)" disabled>
            </div>
            <button onclick="startCareer()">Start Career</button>
        </div>
    </div>

    <!-- SCREEN 2: MAIN GAME -->
    <div id="game-screen">
        <div class="header-bar">
            <div>👤 <span id="ui-name">Name</span> (<span id="ui-nation">Nat</span>)</div>
            <div>🛡️ <span id="ui-team">Team</span></div>
            <div>🏆 <span id="ui-division">Div 3</span></div>
        </div>

        <div class="dashboard">
            <!-- Current Match -->
            <div class="card">
                <h3>Match <span id="ui-match-num">1</span>/9</h3>
                <div>Vs: <span id="ui-opponent" style="color:var(--danger); font-weight:bold;">Opponent</span></div>
                <div class="stats-grid" style="margin-top: 10px;">
                    <div>Runs<span class="stat-value" id="current-runs">0</span></div>
                    <div>Balls<span class="stat-value" id="current-balls">0</span></div>
                </div>
            </div>

            <!-- Season Progress -->
            <div class="card">
                <h3>Season Progress</h3>
                <div style="font-size: 0.9rem; margin-bottom: 5px;">Target: <strong id="ui-target" style="color:var(--primary);">250 Runs</strong></div>
                <div class="stats-grid">
                    <div>Season Runs<span class="stat-value" id="season-runs">0</span></div>
                    <div>Avg<span class="stat-value" id="season-avg">0.00</span></div>
                </div>
            </div>

            <!-- Career Stats -->
            <div class="card">
                <h3>Career Stats</h3>
                <div class="stats-grid">
                    <div>Runs<span class="stat-value" id="career-runs" style="color:#333;">0</span></div>
                    <div>Strike Rate<span class="stat-value" id="career-sr" style="color:#333;">0.00</span></div>
                </div>
            </div>
        </div>

        <div class="game-area">
            <div class="message" id="message">Bowler is ready. Pick a tile!</div>
            
            <div class="tiles-container" id="tiles-container">
                <!-- Tiles generated here -->
            </div>

            <button id="next-inning-btn" class="action-btn" style="display: none;" onclick="startNextMatch()">Play Next Match</button>
            <button id="end-season-btn" class="action-btn" style="display: none;" onclick="showSeasonEnd()">End Season & See Results</button>
        </div>
    </div>

    <!-- SCREEN 3: SEASON END -->
    <div id="season-end-screen">
        <div class="season-end-card">
            <h2>Season Completed!</h2>
            <p id="season-result-msg" style="font-size: 1.2rem; font-weight: bold; text-align: center;"></p>
            <div class="stats-grid" style="margin: 20px 0;">
                <div>Total Runs Scored: <span class="stat-value" id="final-season-runs">0</span></div>
                <div>Target Required: <span class="stat-value" id="final-season-target">0</span></div>
            </div>
            <button onclick="startNewSeason()">Start Next Season</button>
        </div>
    </div>

    <script>
        // Game Data Models
        const TEAMS = ["Strikers", "Titans", "Warriors", "Royals", "Knights", "Spartans", "Legends", "Gladiators", "Invincibles", "Challengers"];
        
        let player = { name: "", nationality: "", team: "", division: 3 };
        
        let career = { runs: 0, balls: 0, outs: 0, matchesPlayed: 0 };
        
        let season = { 
            matchNum: 1, 
            runs: 0, 
            outs: 0, 
            maxMatches: 9,
            targetRuns: 250 // Div 3 default
        };
        
        let currentInnings = { runs: 0, balls: 0, isOut: false };

        // Outcome Probabilities (Harder in higher divisions)
        function getPossibleOutcomes() {
            let base = ['1', '1', '1', '2', '2', '3', 'Four', 'Four', 'Six', 'Dot', 'Dot', 'Dot'];
            // Div 3: 2 LBWs (Easiest)
            // Div 2: 3 LBWs
            // Div 1: 4 LBWs + 2 extra Dots (Hardest)
            if(player.division === 3) return [...base, 'LBW', 'LBW'];
            if(player.division === 2) return [...base, 'LBW', 'LBW', 'LBW'];
            if(player.division === 1) return [...base, 'Dot', 'Dot', 'LBW', 'LBW', 'LBW', 'LBW'];
            return base;
        }

        // DOM Elements
        const screens = {
            setup: document.getElementById('setup-screen'),
            game: document.getElementById('game-screen'),
            seasonEnd: document.getElementById('season-end-screen')
        };
        const messageEl = document.getElementById('message');
        const tilesContainer = document.getElementById('tiles-container');
        const nextInningBtn = document.getElementById('next-inning-btn');
        const endSeasonBtn = document.getElementById('end-season-btn');

        // --- Core Functions ---

        function startCareer() {
            player.name = document.getElementById('p-name').value || "Rookie";
            player.nationality = document.getElementById('p-nation').value || "Unknown";
            player.team = document.getElementById('p-team').value;
            player.division = 3;

            document.getElementById('ui-name').innerText = player.name;
            document.getElementById('ui-nation').innerText = player.nationality;
            document.getElementById('ui-team').innerText = player.team;
            
            switchScreen('game');
            startNewSeason();
        }

        function startNewSeason() {
            // Set Targets based on Division
            if(player.division === 3) season.targetRuns = 250;
            else if(player.division === 2) season.targetRuns = 350;
            else if(player.division === 1) season.targetRuns = 450; // Elite status maintenance

            season.matchNum = 1;
            season.runs = 0;
            season.outs = 0;

            document.getElementById('ui-division').innerText = `Div ${player.division}`;
            document.getElementById('ui-target').innerText = `${season.targetRuns} Runs`;

            switchScreen('game');
            startMatch();
        }

        function startMatch() {
            currentInnings = { runs: 0, balls: 0, isOut: false };
            
            // Pick a random opponent
            let opponents = TEAMS.filter(t => t !== player.team);
            let opponent = opponents[Math.floor(Math.random() * opponents.length)];
            document.getElementById('ui-opponent').innerText = opponent;

            nextInningBtn.style.display = 'none';
            endSeasonBtn.style.display = 'none';
            messageEl.innerText = `Match ${season.matchNum} vs ${opponent} started!`;
            messageEl.style.color = "var(--primary)";
            
            updateUI();
            generateTiles();
        }

        function generateTiles() {
            tilesContainer.innerHTML = '';
            let pool = getPossibleOutcomes();
            let tileOutcomes = [];
            
            for (let i = 0; i < 4; i++) {
                tileOutcomes.push(pool[Math.floor(Math.random() * pool.length)]);
            }

            tileOutcomes.forEach(outcome => {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.innerText = '?';
                tile.onclick = () => handleTileClick(tile, outcome);
                tilesContainer.appendChild(tile);
            });
        }

        function handleTileClick(clickedTile, outcome) {
            if (currentInnings.isOut || clickedTile.classList.contains('revealed')) return;

            currentInnings.balls++;
            career.balls++;

            clickedTile.innerText = outcome;
            clickedTile.classList.add('revealed');

            // Disable other tiles
            document.querySelectorAll('.tile').forEach(t => {
                if (t !== clickedTile) t.classList.add('disabled');
                t.onclick = null; 
            });

            if (outcome === 'LBW') {
                clickedTile.classList.add('out');
                messageEl.innerText = "🚨 OUT! Plumb LBW! 🚨";
                messageEl.style.color = "var(--danger)";
                handleOut();
            } else {
                let runsScored = 0;
                if (outcome === '1') runsScored = 1;
                if (outcome === '2') runsScored = 2;
                if (outcome === '3') runsScored = 3;
                if (outcome === 'Four') runsScored = 4;
                if (outcome === 'Six') runsScored = 6;

                currentInnings.runs += runsScored;
                season.runs += runsScored;
                career.runs += runsScored;

                if (outcome === 'Dot') {
                    clickedTile.classList.add('dot');
                    messageEl.innerText = "Solid defense. Dot ball.";
                    messageEl.style.color = "#718093";
                } else {
                    clickedTile.classList.add('runs');
                    messageEl.innerText = `Shot! Scored ${outcome === 'Four'||outcome === 'Six' ? outcome : runsScored + ' run(s)'}.`;
                    messageEl.style.color = "var(--secondary)";
                }

                updateUI();
                setTimeout(() => {
                    if (!currentInnings.isOut) {
                        generateTiles();
                        messageEl.innerText = "Bowler running in... Pick a tile!";
                        messageEl.style.color = "var(--primary)";
                    }
                }, 1000);
            }
        }

        function handleOut() {
            currentInnings.isOut = true;
            career.outs++;
            season.outs++;
            career.matchesPlayed++;
            updateUI();

            if (season.matchNum < season.maxMatches) {
                nextInningBtn.style.display = 'block';
            } else {
                endSeasonBtn.style.display = 'block';
            }
        }

        function startNextMatch() {
            season.matchNum++;
            startMatch();
        }

        function showSeasonEnd() {
            switchScreen('seasonEnd');
            document.getElementById('final-season-runs').innerText = season.runs;
            document.getElementById('final-season-target').innerText = season.targetRuns;

            let msgEl = document.getElementById('season-result-msg');
            
            if (season.runs >= season.targetRuns) {
                if (player.division > 1) {
                    player.division--;
                    msgEl.innerText = `🏆 CONGRATULATIONS! Target Achieved. Promoted to Division ${player.division}!`;
                    msgEl.style.color = "var(--secondary)";
                } else {
                    msgEl.innerText = `👑 INCREDIBLE! You maintained your Elite Status in Division 1!`;
                    msgEl.style.color = "var(--warning)";
                }
            } else {
                if (player.division < 3) {
                    player.division++;
                    msgEl.innerText = `🔻 RELEGATED! You missed the target. Dropped to Division ${player.division}.`;
                    msgEl.style.color = "var(--danger)";
                } else {
                    msgEl.innerText = `❌ Target missed. You will remain in Division 3. Try again!`;
                    msgEl.style.color = "var(--danger)";
                }
            }
        }

        function updateUI() {
            // Current Match
            document.getElementById('ui-match-num').innerText = season.matchNum;
            document.getElementById('current-runs').innerText = currentInnings.runs;
            document.getElementById('current-balls').innerText = currentInnings.balls;

            // Season
            document.getElementById('season-runs').innerText = season.runs;
            let sAvg = season.outs > 0 ? (season.runs / season.outs).toFixed(2) : season.runs.toFixed(2);
            document.getElementById('season-avg').innerText = sAvg;

            // Career
            document.getElementById('career-runs').innerText = career.runs;
            let sr = career.balls > 0 ? ((career.runs / career.balls) * 100).toFixed(2) : "0.00";
            document.getElementById('career-sr').innerText = sr;
        }

        function switchScreen(screenName) {
            screens.setup.style.display = 'none';
            screens.game.style.display = 'none';
            screens.seasonEnd.style.display = 'none';
            screens[screenName].style.display = 'flex';
        }
    </script>
</body>
</html>
